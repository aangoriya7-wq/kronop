[package]
name = "kronop-native-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core dependencies
libc = "0.2"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Performance
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"
num_cpus = "1.16"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Video processing (optional, for real implementation)
ffmpeg-next = { version = "6.0", optional = true }

[features]
default = []
ffmpeg = ["ffmpeg-next"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
os_log = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
