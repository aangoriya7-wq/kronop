# Redis Cluster - Global Caching for 500M+ Users
# High-performance caching with Redis cluster
# Most viewed videos served directly from RAM

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: kronop-production
data:
  redis.conf: |
    # Redis Cluster Configuration
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 5000
    cluster-announce-ip $(POD_IP)
    cluster-announce-port 6379
    cluster-announce-bus-port 16379
    
    # Performance Settings
    maxmemory 8gb
    maxmemory-policy allkeys-lru
    save ""
    appendonly no
    
    # Network Settings
    tcp-keepalive 300
    timeout 0
    
    # Persistence Settings
    rdbcompression yes
    rdbchecksum yes
    
    # Logging
    loglevel notice
    syslog-enabled yes
    
    # Security
    requirepass kronop_redis_password
    protected-mode yes
    
    # Performance Tuning
    tcp-backlog 511
    databases 16
    always-show-logo yes
    
  redis-cluster-setup.sh: |
    #!/bin/bash
    # Redis Cluster Setup Script
    
    # Wait for all Redis nodes to be ready
    echo "Waiting for Redis nodes to be ready..."
    sleep 30
    
    # Initialize Redis cluster
    redis-cli --cluster create \
      redis-cluster-0:6379 \
      redis-cluster-1:6379 \
      redis-cluster-2:6379 \
      redis-cluster-3:6379 \
      redis-cluster-4:6379 \
      redis-cluster-5:6379 \
      --cluster-replicas 1 \
      --cluster-yes \
      -a kronop_redis_password
    
    echo "Redis cluster initialized successfully"
    
    # Verify cluster status
    redis-cli --cluster check redis-cluster-0:6379 -a kronop_redis_password

---
# Redis Cluster StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: kronop-production
  labels:
    app: redis-cluster
    tier: cache
spec:
  serviceName: redis-cluster
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: gossip
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: REDIS_PASSWORD
          value: "kronop_redis_password"
        command:
        - /bin/sh
        - -c
        - |
          # Copy config files
          cp /etc/redis/redis.conf /usr/local/etc/redis/redis.conf
          cp /etc/redis/redis-cluster-setup.sh /usr/local/bin/redis-cluster-setup.sh
          chmod +x /usr/local/bin/redis-cluster-setup.sh
          
          # Start Redis with custom config
          redis-server /usr/local/etc/redis/redis.conf
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 100Gi

---
# Redis Cluster Service
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: kronop-production
  labels:
    app: redis-cluster
    tier: cache
spec:
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
    name: client
  - port: 16379
    targetPort: 16379
    name: gossip
  selector:
    app: redis-cluster

---
# Redis Cluster Headless Service for Individual Pods
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-headless
  namespace: kronop-production
  labels:
    app: redis-cluster
    tier: cache
spec:
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
    name: client
  - port: 16379
    targetPort: 16379
    name: gossip
  selector:
    app: redis-cluster
  publishNotReadyAddresses: true

---
# Redis Cluster Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redis-cluster-hpa
  namespace: kronop-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: redis-cluster
  minReplicas: 6
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# Redis Cluster Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cluster-pdb
  namespace: kronop-production
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: redis-cluster

---
# Redis Cluster Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cluster-netpol
  namespace: kronop-production
spec:
  podSelector:
    matchLabels:
      app: redis-cluster
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 6379
  - from:
    - podSelector:
        matchLabels:
          app: video-processor
    ports:
    - protocol: TCP
      port: 6379
  - from:
    - podSelector:
        matchLabels:
          app: ai-enhancement
    ports:
    - protocol: TCP
      port: 6379
  - from:
    - podSelector:
        matchLabels:
          app: analytics
    ports:
    - protocol: TCP
      port: 6379
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-cluster
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 16379

---
# Redis Cluster Service Monitor (for Prometheus)
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-monitor
  namespace: kronop-production
  labels:
    app: redis-cluster
    tier: cache
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: redis-cluster
  ports:
  - port: 9121
    targetPort: 9121
    name: metrics

---
# Redis Exporter Sidecar
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: redis-exporter
  namespace: kronop-production
  labels:
    app: redis-exporter
    tier: monitoring
spec:
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
        tier: monitoring
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "redis://redis-cluster:6379"
        - name: REDIS_PASSWORD
          value: "kronop_redis_password"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9121
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9121
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
