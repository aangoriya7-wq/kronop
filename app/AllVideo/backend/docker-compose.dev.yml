version: '3.8'

services:
  kronop-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kronop-server-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
      - "2345:2345"  # Debug port
    volumes:
      - .:/app
      - ../data:/data
      - ../logs:/logs
      - ../config:/config
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=development
      - LOG_LEVEL=debug
      - DB_HOST=postgres-dev
      - REDIS_HOST=redis-dev
    depends_on:
      - postgres-dev
      - redis-dev
    networks:
      - kronop-dev-network
    command: ["air", "-c", ".air.toml"]

  postgres-dev:
    image: postgres:15-alpine
    container_name: kronop-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: kronop_dev
      POSTGRES_USER: kronop_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-dev.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - kronop-dev-network

  redis-dev:
    image: redis:7-alpine
    container_name: kronop-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass dev_password
    volumes:
      - redis_dev_data:/data
      - ./configs/redis-dev.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6380:6379"
    networks:
      - kronop-dev-network

  # Development tools
  adminer:
    image: adminer:latest
    container_name: kronop-adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-dev
    depends_on:
      - postgres-dev
    networks:
      - kronop-dev-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: kronop-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis-dev:6379:0:dev_password
    depends_on:
      - redis-dev
    networks:
      - kronop-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  kronop-dev-network:
    driver: bridge
