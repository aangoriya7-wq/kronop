[package]
name = "kronop-video-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# JSI Bridge for React Native
jni = "0.21"
jni-sys = "0.3"

# Video Processing
ffmpeg-next = "6.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Memory Management
libc = "0.2"
alloc = "0.0"

# Graphics & Vulkan
vulkan = "0.3"
ash = "0.37"

# Async & Performance
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"
num_cpus = "1.16"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Network & Streaming
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"

[dependencies.jni]
version = "0.21"
features = ["invocation"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"
